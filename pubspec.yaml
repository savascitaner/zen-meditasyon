name: zen_meditation
description: "Calm, minimal meditation, yoga and stress-management app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/content/
